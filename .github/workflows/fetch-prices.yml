name: Fetch Steam Prices

on:
    schedule:
        - cron: "0 4,14 * * *" # runs daily at 04:00 and 14:00 UTC
    workflow_dispatch: # manual trigger

jobs:
    fetch:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Set up uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
              with:
                  enable-cache: true

            - name: Fetch prices
              run: uv run fetch_prices.py

            - name: Configure git
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

            - name: Commit results to data branch
              run: |
                  cp prices.json /tmp/prices.json
                  git fetch origin data
                  git checkout --force data
                  cp /tmp/prices.json prices.json
                  git add prices.json
                  git diff --cached --quiet || git commit -m "Update prices $(date -u +'%Y-%m-%d %H-%M-%S')"
                  git push origin data
