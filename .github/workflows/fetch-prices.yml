name: Fetch Steam Prices

on:
    schedule:
        - cron: "0 */6 * * *" # runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    workflow_dispatch: # manual trigger

jobs:
    fetch:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  enable-cache: true

            - name: Fetch prices
              run: uv run fetch_prices.py
              env:
                  PYTHONUNBUFFERED: "1" # stream per-item progress live to the log

            - name: Configure git
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

            - name: Commit results to data branch
              run: |
                  cp prices.json /tmp/prices.json
                  git fetch origin data
                  git checkout --force data
                  cp /tmp/prices.json prices.json
                  git add prices.json
                  git diff --cached --quiet || git commit -m "Update prices $(date -u +'%Y-%m-%d %H-%M-%S')"
                  git push origin data
