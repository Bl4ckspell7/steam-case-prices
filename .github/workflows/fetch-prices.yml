name: Fetch Steam Prices

on:
    schedule:
        # 4 slices, 1h apart → one run per hour, each item refreshed every 4h.
        # Small per-run request count + 1h spacing keeps under Steam's per-IP block.
        - cron: "0 0-23/4 * * *" # slice 0 → 00,04,08,12,16,20 UTC
        - cron: "0 1-23/4 * * *" # slice 1 → 01,05,09,13,17,21 UTC
        - cron: "0 2-23/4 * * *" # slice 2 → 02,06,10,14,18,22 UTC
        - cron: "0 3-23/4 * * *" # slice 3 → 03,07,11,15,19,23 UTC
    workflow_dispatch: # manual trigger — pick a slice (defaults to a safe 1/4 slice)
        inputs:
            slice_count:
                description: "Number of slices (set to 1 for a full run; may hit the IP block)"
                default: "4"
                required: false
            slice_index:
                description: "Which slice to fetch, 0-based and < slice_count"
                default: "0"
                required: false

jobs:
    fetch:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  enable-cache: true

            - name: Determine slice
              env:
                  SCHEDULE: ${{ github.event.schedule }}
                  INPUT_COUNT: ${{ github.event.inputs.slice_count }}
                  INPUT_INDEX: ${{ github.event.inputs.slice_index }}
              run: |
                  if [ -n "$SCHEDULE" ]; then
                      # scheduled run → slice is fixed by which cron line fired
                      case "$SCHEDULE" in
                          "0 0-23/4 * * *") count=4; index=0 ;;
                          "0 1-23/4 * * *") count=4; index=1 ;;
                          "0 2-23/4 * * *") count=4; index=2 ;;
                          "0 3-23/4 * * *") count=4; index=3 ;;
                          *) count=4; index=0 ;;
                      esac
                  else
                      # manual dispatch → slice chosen via inputs (safe 1/4 default)
                      count="${INPUT_COUNT:-4}"
                      index="${INPUT_INDEX:-0}"
                  fi
                  echo "SLICE_COUNT=$count" >> "$GITHUB_ENV"
                  echo "SLICE_INDEX=$index" >> "$GITHUB_ENV"
                  echo "Fetching slice $index of $count"

            - name: Seed existing prices
              run: |
                  git fetch origin data --depth 1 || true
                  if git rev-parse --verify origin/data >/dev/null 2>&1; then
                      # data branch exists → its snapshot MUST load, or fail the run
                      # rather than commit a snapshot that wipes the carried-over items
                      git show origin/data:prices.json > prices.json
                  else
                      echo '{"prices":[]}' > prices.json # genuine first-run bootstrap
                  fi

            - name: Fetch prices
              run: uv run fetch_prices.py
              env:
                  PYTHONUNBUFFERED: "1" # stream per-item progress live to the log

            - name: Configure git
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

            - name: Commit results to data branch
              run: |
                  cp prices.json /tmp/prices.json
                  git fetch origin data
                  git checkout --force data
                  cp /tmp/prices.json prices.json
                  git add prices.json
                  git diff --cached --quiet || git commit -m "Update prices $(date -u +'%Y-%m-%d %H-%M-%S')"
                  git push origin data
